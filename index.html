<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA: fullscreen home screen launch (removes browser chrome) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Preter" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#4F46E5" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- App icon (home screen) -->
    <link rel="apple-touch-icon" href="https://api.dicebear.com/7.x/shapes/svg?seed=preter&backgroundColor=4F46E5,C7D2FE&size=180" />
    <link rel="icon" type="image/svg+xml" href="https://api.dicebear.com/7.x/shapes/svg?seed=preter&backgroundColor=4F46E5,C7D2FE&size=64" />

    <!-- SEO / Open Graph -->
    <title>Preter - Chat in any language, instantly</title>
    <meta name="description" content="Preter translates every message in real-time so you and your contacts always read in your own language. Zero-knowledge. Zero friction." />
    <meta property="og:title" content="Preter - Chat in any language" />
    <meta property="og:description" content="Real-time translation for every message. End-to-end encrypted." />
    <meta property="og:type" content="website" />

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Prevent flash of unstyled content -->
    <style>
      html, body { margin: 0; padding: 0; background: #F9FAFB; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
